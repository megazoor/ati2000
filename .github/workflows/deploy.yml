name: Deploy to Linode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd dashboard && npm ci
          
      - name: Build frontend
        run: |
          cd dashboard && npm run build
          
      - name: Run tests
        run: npm test || true
        
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_HOST }} >> ~/.ssh/known_hosts
        
      - name: Deploy to Linode
        run: |
          rsync -avz --exclude 'node_modules' \
                     --exclude '.git' \
                     --exclude '.github' \
                     --exclude '.env' \
                     --exclude 'dashboard/node_modules' \
                     --exclude 'logs/*' \
                     --exclude '.next' \
                     ./ ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}:~/advancedtraderai/
          
      - name: Run post-deploy script on server
        run: |
          ssh ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }} 'cd ~/advancedtraderai && bash scripts/post-deploy.sh'